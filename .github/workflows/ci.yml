name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  docs-lint:
    name: Lint documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run documentation linter tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Lint repository documentation
        run: python3 scripts/lint_docs.py

  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      # The publish workflow only runs on a [publish] commit to main, so without this job a
      # release-blocking mistake stays invisible until the moment it blocks a release. Two
      # contradictory gates shipped unnoticed exactly that way: one required every workspace
      # crate in publish_order while the other rejected any publish=false crate, which made
      # publishing impossible for as long as the signing tool existed. That crate is gone, but
      # the deadlock was a property of the gates, not of the crate, so both still run here.
      - name: Validate release metadata
        run: scripts/check-release-metadata.sh --skip-tag-check
      - name: Validate crate packaging and dependency order
        run: scripts/publish-crates.sh --check

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test full workspace
        run: cargo test --workspace --all-features --locked
      # Rule packages ship unsigned and are meant to be editable. What still has to hold is that an
      # edit is never silent: `content_digest` binds a clean authorization to the rule bytes that
      # produced the scan. `editing_a_rule_changes_the_content_digest_but_still_loads` covers this
      # in-process; this step re-checks it through the built binary, because the value that actually
      # gates a clean is the one the CLI reports, not the one a unit test computes.
      - name: An edited rule loads and changes the reported cleaner set digest
        run: |
          set -euo pipefail
          rule='crates/sweepx-catalog/resources/cleaners/org.sweepx.cargo-target/rules/cargo-target.json'
          cp "$rule" "$rule.orig"
          restore() { mv "$rule.orig" "$rule"; }
          trap restore EXIT

          read_digest() {
            cargo run --locked --quiet --package sweepx-cli -- \
              --format json cleaner list | python3 -c \
              'import json,sys; print(json.load(sys.stdin)["summary"]["cleanerSetDigest"])'
          }

          before="$(read_digest)"

          # Perturb a non-identity field: `id` is cross-referenced by the manifest and would be
          # rejected as an inventory mismatch rather than accepted as an edit.
          sed -i 's/"zeroWriteVerified": true/"zeroWriteVerified": false/' "$rule"
          if cmp -s "$rule" "$rule.orig"; then
            echo 'the test edit did not change the rule file' >&2
            exit 1
          fi

          after="$(read_digest)"
          echo "before=$before"
          echo "after =$after"
          if [[ "$before" == "$after" ]]; then
            echo 'editing a rule must change the cleaner set digest' >&2
            exit 1
          fi

  schemas:
    name: Validate JSON schemas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schemas
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.0
      - name: Reject private registries in lockfile
        run: |
          if grep -Eq 'https?://(bnpm\.byted\.org|[^/]*\.bytedance\.[^/]+)/' bun.lock; then
            echo 'schemas/bun.lock contains a private package registry URL' >&2
            exit 1
          fi
      - name: Install schema dependencies
        run: bun install --frozen-lockfile
      - name: Validate schemas and examples
        run: bun run validate

  site:
    name: Build documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.0
      - name: Reject private registries in lockfile
        run: |
          if grep -Eq 'https?://(bnpm\.byted\.org|[^/]*\.bytedance\.[^/]+)/' bun.lock; then
            echo 'site/bun.lock contains a private package registry URL' >&2
            exit 1
          fi
      - name: Install site dependencies
        run: bun install --frozen-lockfile
      - name: Build site
        run: bun run docs:build

  installer-smoke:
    name: Installer smoke tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: bash scripts/test-installers.sh
          - os: windows-latest
            command: pwsh -NoLogo -NoProfile -File scripts/test-installers.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test installer
        run: ${{ matrix.command }}

  native-cli:
    name: Native CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: target/x86_64-unknown-linux-gnu/debug/sweepx
            capability_os: linux
            scan_state: degraded
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: target/x86_64-apple-darwin/debug/sweepx
            capability_os: macos
            scan_state: degraded
          - os: macos-15
            target: aarch64-apple-darwin
            executable: target/aarch64-apple-darwin/debug/sweepx
            capability_os: macos
            scan_state: degraded
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: target/x86_64-pc-windows-msvc/debug/sweepx.exe
            capability_os: windows
            scan_state: degraded
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Check Windows platform crates natively
        if: matrix.capability_os == 'windows'
        env:
          RUSTFLAGS: "-D warnings"
        run: >-
          cargo check --locked --all-targets --target ${{ matrix.target }}
          --package sweepx-model
          --package sweepx-platform
          --package sweepx-platform-windows
          --package sweepx-core
          --package sweepx-tui
          --package sweepx-cli
      - name: Lint Windows platform crates natively
        if: matrix.capability_os == 'windows'
        run: >-
          cargo clippy --locked --all-targets --target ${{ matrix.target }}
          --package sweepx-model
          --package sweepx-platform
          --package sweepx-platform-windows
          --package sweepx-core
          --package sweepx-tui
          --package sweepx-cli
          -- -D warnings
      - name: Test Windows scan stack natively
        if: matrix.capability_os == 'windows'
        run: >-
          cargo test --locked --target ${{ matrix.target }}
          --package sweepx-platform
          --package sweepx-platform-windows
          --package sweepx-core
          --package sweepx-tui
          --package sweepx-cli
      - name: Probe Windows NTFS acceleration read-only path
        if: matrix.capability_os == 'windows'
        shell: pwsh
        run: |
          $env:SWEEPX_RUN_NATIVE_NTFS_PROBE = "1"
          # Every probe is named explicitly because libtest ORs its filters. `native_ntfs_probe`
          # alone silently skipped the change-token probe, which carries an unrelated name. The
          # remaining ignored probes are deliberately excluded: they panic rather than skip when
          # the volume handle is denied, and one is pinned to a drive letter that no runner has.
          cargo test --locked --target ${{ matrix.target }} --package sweepx-platform-windows -- --ignored --nocapture --test-threads=1 native_ntfs_probe the_change_token_notices_a_real_write a_journal_range_read_only_accepts_record_boundaries volume_access_masks_behave_the_same_at_both_privilege_levels
      - name: Exercise macOS bulk directory enumeration
        if: matrix.capability_os == 'macos'
        run: >-
          cargo test --locked --target ${{ matrix.target }}
          --package sweepx-platform-macos
          enumerate_children_uses_opened_dir_and_enforces_limits
      - name: Benchmark macOS bulk directory enumeration smoke
        if: matrix.capability_os == 'macos'
        env:
          SWEEPX_RUN_NATIVE_MACOS_BULK_BENCH: "1"
        run: >-
          cargo test --locked --target ${{ matrix.target }}
          --package sweepx-platform-macos
          native_bulk_enumeration_benchmark_smoke -- --ignored --nocapture
      - name: Test macOS cache status natively
        if: matrix.capability_os == 'macos'
        run: |
          cargo test --locked --target "${{ matrix.target }}" --package sweepx-cache
          cargo test --locked --target "${{ matrix.target }}" --package sweepx-cli cache_status
      - name: Build native CLI
        run: cargo build --locked --package sweepx-cli --target ${{ matrix.target }}
      - name: Smoke-test Windows scan and durable state
        if: matrix.capability_os == 'windows'
        shell: pwsh
        env:
          BIN: ${{ matrix.executable }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          # Every stage prints what it observed before asserting on it. A previous run of this
          # step failed with exit 1 and no output whatsoever, which made it impossible to tell
          # which assertion tripped or what value it saw. `throw` does reach stderr, so the
          # silence was never explained -- the response is to stop relying on the failure
          # message alone and record the evidence as the step goes.
          # Write-Host, not Write-Output: a function's output stream becomes its return value, so
          # diagnostics written with Write-Output are handed back to the caller and lost. Measured
          # -- with Write-Output not one stage label reached the transcript.
          function Invoke-Sweepx {
            param([string]$Label, [string[]]$Arguments)
            Write-Host "== $Label =="
            Write-Host "   args: $($Arguments -join ' ')"
            # 2>&1 is deliberate: without it a diagnostic written to stderr is discarded and the
            # JSON parse fails with no trace of the cause.
            $text = & $env:BIN @Arguments 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host "   exit: $code"
            if ($text.Trim().Length -eq 0) {
              Write-Host "   output: (empty)"
            } else {
              $head = $text.Trim()
              if ($head.Length -gt 600) { $head = $head.Substring(0, 600) + " ...(truncated)" }
              Write-Host "   output: $head"
            }
            return [pscustomobject]@{ Text = $text; Exit = $code }
          }

          $fixture = Join-Path $env:RUNNER_TEMP ("sweepx-ci-" + [guid]::NewGuid().ToString("N"))
          $scanRoot = Join-Path $fixture "scan-root"
          $stateDir = Join-Path $fixture "state"
          New-Item -ItemType Directory -Path $scanRoot -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $scanRoot "sample.txt") -Value "sweepx"
          Write-Host "fixture: $fixture"
          Write-Host "binary : $env:BIN (exists: $(Test-Path -LiteralPath $env:BIN))"

          $plain = Invoke-Sweepx "plain scan" @("--format", "json", "scan", $scanRoot)
          if ($plain.Exit -ne 0) {
            throw "Windows scan must complete successfully, got exit code $($plain.Exit)"
          }
          $scan = $plain.Text | ConvertFrom-Json
          if ($scan.kind -ne "scan.result") {
            throw "unexpected scan output kind: $($scan.kind)"
          }
          if ($scan.status -ne "ok") {
            throw "expected Windows scan status ok, got $($scan.status)"
          }
          if ($scan.summary.platform -ne "windows") {
            throw "expected Windows scan platform, got $($scan.summary.platform)"
          }
          if ($scan.summary.rootCount -ne "1") {
            throw "expected one Windows scan root, got $($scan.summary.rootCount)"
          }
          if ($scan.data.entries.Count -lt 1) {
            throw "expected Windows scan to report the fixture entry"
          }

          # Durable state is enabled on Windows, so the smoke test asserts the property it exists
          # for: a preview written by one run is loaded back by the next. Checking only that the
          # directory appears would pass even if nothing were ever read from it again.
          $first = Invoke-Sweepx "first run with --state-dir" `
            @("--format", "json", "--state-dir", $stateDir, "scan", $scanRoot)
          if ($first.Exit -ne 0) {
            throw "explicit Windows state directory must be accepted, got exit code $($first.Exit)"
          }
          $firstJson = $first.Text | ConvertFrom-Json
          $storeStatus = $firstJson.summary.cachePreview.storeStatus
          Write-Host "   storeStatus: $storeStatus"
          if ($storeStatus -ne "written") {
            throw "expected the first run to persist a preview, got $storeStatus"
          }
          $writtenGeneration = $firstJson.summary.cachePreview.writtenGeneration
          Write-Host "   writtenGeneration: $writtenGeneration"
          if (-not $writtenGeneration) {
            throw "expected a generation id for the persisted preview"
          }
          if (-not (Test-Path -LiteralPath $stateDir)) {
            throw "an accepted state directory must exist after the run"
          }

          $second = Invoke-Sweepx "second run, should load the preview" `
            @("--format", "json", "--state-dir", $stateDir, "scan", $scanRoot)
          if ($second.Exit -ne 0) {
            throw "the second Windows scan must succeed, got exit code $($second.Exit)"
          }
          $secondJson = $second.Text | ConvertFrom-Json
          $loadStatus = $secondJson.summary.cachePreview.loadStatus
          $loadedGeneration = $secondJson.summary.cachePreview.loadedGeneration
          Write-Host "   loadStatus: $loadStatus"
          Write-Host "   loadedGeneration: $loadedGeneration"
          if ($loadStatus -ne "stale_preview") {
            throw "expected the second run to load the persisted preview, got $loadStatus"
          }
          if ($loadedGeneration -ne $writtenGeneration) {
            throw "expected generation $writtenGeneration to be loaded, got $loadedGeneration"
          }

          # The guard that makes durable state defensible here: a directory other accounts can
          # reach must be refused rather than used. Widened through the OS's own tool so the
          # test exercises a real misconfiguration and not a synthetic one.
          $sharedDir = Join-Path $fixture "shared-state"
          New-Item -ItemType Directory -Path $sharedDir -Force | Out-Null
          $icacls = icacls $sharedDir /grant "*S-1-1-0:(OI)(CI)F" 2>&1 | Out-String
          Write-Host "== widen the shared state directory =="
          Write-Host "   icacls exit: $LASTEXITCODE"
          Write-Host "   icacls out : $($icacls.Trim())"

          $shared = Invoke-Sweepx "world-reachable state dir must be refused" `
            @("--format", "json", "--state-dir", $sharedDir, "scan", $scanRoot)
          if ($shared.Exit -eq 0) {
            throw "a state directory reachable by other users must be refused"
          }
          if ($shared.Text -notmatch "accessible only to them") {
            throw "the refusal did not explain the privacy requirement: $($shared.Text)"
          }

          Write-Host "all Windows durable-state assertions passed"
      - name: Smoke-test binary and capability truthfulness
        shell: bash
        env:
          BIN: ${{ matrix.executable }}
          EXPECTED_OS: ${{ matrix.capability_os }}
          EXPECTED_SCAN_STATE: ${{ matrix.scan_state }}
        run: |
          set -euo pipefail
          "$BIN" --version
          "$BIN" --help >/dev/null

          set +e
          "$BIN" --format json capabilities > capabilities.json
          status=$?
          set -e
          if [[ $status -ne 4 ]]; then
            echo "capabilities must report the documented partial exit code 4, got $status" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          with open("capabilities.json", encoding="utf-8") as handle:
              output = json.load(handle)
          if output["kind"] != "capabilities.result":
              raise SystemExit(f"unexpected output kind: {output['kind']}")
          expected_os = os.environ["EXPECTED_OS"]
          expected_state = os.environ["EXPECTED_SCAN_STATE"]
          if output["summary"]["currentPlatform"] != expected_os:
              raise SystemExit(f"expected current platform {expected_os}")
          records = [
              record for record in output["data"]["capabilities"]
              if record["qualificationKey"]["osFamily"] == expected_os
              and record["qualificationKey"]["capability"] == "scan.local.directory"
          ]
          if len(records) != 1 or records[0]["state"] != expected_state:
              raise SystemExit(
                  f"expected one {expected_os} scan capability in state {expected_state}"
              )
          PY
