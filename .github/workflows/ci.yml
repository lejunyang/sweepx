name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  docs-lint:
    name: Lint documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run documentation linter tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Lint repository documentation
        run: python3 scripts/lint_docs.py

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test full workspace
        run: cargo test --workspace --all-features --locked
      # `built_ins_load_and_validate` proves the shipped packages verify, but it cannot prove the
      # signing tool still produces signatures that verifier accepts: it reads bytes committed long
      # ago. Only round-tripping a package through `sign` exercises that, and without it the tool
      # can rot undetected until someone needs to edit a rule and finds they cannot.
      - name: Verify the signing tool round-trips a package
        run: |
          set -euo pipefail
          key_dir="$(mktemp -d)"
          pkg_dir="$(mktemp -d)/org.sweepx.cargo-target"
          cp -R crates/sweepx-catalog/resources/cleaners/org.sweepx.cargo-target "$pkg_dir"

          # A development key is deliberately not in BUILTIN_TRUST_STORE, so the tool must be told
          # which key to verify against; that path is what contributors actually use.
          cargo run --locked --package sweepx-cleaner-sign -- keygen \
            --key "$key_dir/dev.key" --key-id ci-dev-key --publisher org.sweepx
          cargo run --locked --package sweepx-cleaner-sign -- sign \
            --package "$pkg_dir" --key "$key_dir/dev.key"

          # Signing an unmodified package must be idempotent, otherwise re-signing would churn the
          # SIGNATURE file on every build and make real changes unreviewable.
          second="$(cargo run --locked --quiet --package sweepx-cleaner-sign -- sign \
            --package "$pkg_dir" --key "$key_dir/dev.key")"
          echo "$second"
          if ! grep -q 'unchanged' <<<"$second"; then
            echo 'signing an unmodified package must report it as unchanged' >&2
            exit 1
          fi

          # An edited rule must produce a different digest; if it did not, tampering would be
          # invisible to the loader. `id` is cross-referenced by the manifest and is rejected as an
          # identity mismatch, so perturb a non-identity field instead.
          before="$(sha256sum "$pkg_dir/SIGNATURE" | cut -d' ' -f1)"
          sed -i 's/"zeroWriteVerified": true/"zeroWriteVerified": false/' "$pkg_dir/rules/cargo-target.json"
          cargo run --locked --quiet --package sweepx-cleaner-sign -- sign \
            --package "$pkg_dir" --key "$key_dir/dev.key"
          after="$(sha256sum "$pkg_dir/SIGNATURE" | cut -d' ' -f1)"
          if [[ "$before" == "$after" ]]; then
            echo 'editing a rule must change the package signature' >&2
            exit 1
          fi

  schemas:
    name: Validate JSON schemas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schemas
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.0
      - name: Reject private registries in lockfile
        run: |
          if grep -Eq 'https?://(bnpm\.byted\.org|[^/]*\.bytedance\.[^/]+)/' bun.lock; then
            echo 'schemas/bun.lock contains a private package registry URL' >&2
            exit 1
          fi
      - name: Install schema dependencies
        run: bun install --frozen-lockfile
      - name: Validate schemas and examples
        run: bun run validate

  site:
    name: Build documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.0
      - name: Reject private registries in lockfile
        run: |
          if grep -Eq 'https?://(bnpm\.byted\.org|[^/]*\.bytedance\.[^/]+)/' bun.lock; then
            echo 'site/bun.lock contains a private package registry URL' >&2
            exit 1
          fi
      - name: Install site dependencies
        run: bun install --frozen-lockfile
      - name: Build site
        run: bun run docs:build

  installer-smoke:
    name: Installer smoke tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: bash scripts/test-installers.sh
          - os: windows-latest
            command: pwsh -NoLogo -NoProfile -File scripts/test-installers.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test installer
        run: ${{ matrix.command }}

  native-cli:
    name: Native CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: target/x86_64-unknown-linux-gnu/debug/sweepx
            capability_os: linux
            scan_state: degraded
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: target/x86_64-apple-darwin/debug/sweepx
            capability_os: macos
            scan_state: degraded
          - os: macos-15
            target: aarch64-apple-darwin
            executable: target/aarch64-apple-darwin/debug/sweepx
            capability_os: macos
            scan_state: degraded
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: target/x86_64-pc-windows-msvc/debug/sweepx.exe
            capability_os: windows
            scan_state: degraded
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Check Windows platform crates natively
        if: matrix.capability_os == 'windows'
        env:
          RUSTFLAGS: "-D warnings"
        run: >-
          cargo check --locked --all-targets --target ${{ matrix.target }}
          --package sweepx-model
          --package sweepx-platform
          --package sweepx-platform-windows
          --package sweepx-core
          --package sweepx-tui
          --package sweepx-cli
      - name: Lint Windows platform crates natively
        if: matrix.capability_os == 'windows'
        run: >-
          cargo clippy --locked --all-targets --target ${{ matrix.target }}
          --package sweepx-model
          --package sweepx-platform
          --package sweepx-platform-windows
          --package sweepx-core
          --package sweepx-tui
          --package sweepx-cli
          -- -D warnings
      - name: Test Windows scan stack natively
        if: matrix.capability_os == 'windows'
        run: >-
          cargo test --locked --target ${{ matrix.target }}
          --package sweepx-platform
          --package sweepx-platform-windows
          --package sweepx-core
          --package sweepx-tui
          --package sweepx-cli
      - name: Probe Windows NTFS acceleration read-only path
        if: matrix.capability_os == 'windows'
        shell: pwsh
        run: |
          $env:SWEEPX_RUN_NATIVE_NTFS_PROBE = "1"
          cargo test --locked --target ${{ matrix.target }} --package sweepx-platform-windows native_ntfs_probe -- --ignored --nocapture
      - name: Exercise macOS bulk directory enumeration
        if: matrix.capability_os == 'macos'
        run: >-
          cargo test --locked --target ${{ matrix.target }}
          --package sweepx-platform-macos
          enumerate_children_uses_opened_dir_and_enforces_limits
      - name: Benchmark macOS bulk directory enumeration smoke
        if: matrix.capability_os == 'macos'
        env:
          SWEEPX_RUN_NATIVE_MACOS_BULK_BENCH: "1"
        run: >-
          cargo test --locked --target ${{ matrix.target }}
          --package sweepx-platform-macos
          native_bulk_enumeration_benchmark_smoke -- --ignored --nocapture
      - name: Test macOS cache status natively
        if: matrix.capability_os == 'macos'
        run: |
          cargo test --locked --target "${{ matrix.target }}" --package sweepx-cache
          cargo test --locked --target "${{ matrix.target }}" --package sweepx-cli cache_status
      - name: Build native CLI
        run: cargo build --locked --package sweepx-cli --target ${{ matrix.target }}
      - name: Smoke-test Windows scan and fail-closed state
        if: matrix.capability_os == 'windows'
        shell: pwsh
        env:
          BIN: ${{ matrix.executable }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $fixture = Join-Path $env:RUNNER_TEMP ("sweepx-ci-" + [guid]::NewGuid().ToString("N"))
          $scanRoot = Join-Path $fixture "scan-root"
          $stateDir = Join-Path $fixture "state"
          New-Item -ItemType Directory -Path $scanRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $scanRoot "sample.txt") -Value "sweepx"

          $scanText = & $env:BIN --format json scan $scanRoot | Out-String
          $scanExit = $LASTEXITCODE
          if ($scanExit -ne 0) {
            throw "Windows scan must complete successfully, got exit code $scanExit"
          }
          $scan = $scanText | ConvertFrom-Json
          if ($scan.kind -ne "scan.result") {
            throw "unexpected scan output kind: $($scan.kind)"
          }
          if ($scan.status -ne "ok") {
            throw "expected Windows scan status ok, got $($scan.status)"
          }
          if ($scan.summary.platform -ne "windows") {
            throw "expected Windows scan platform, got $($scan.summary.platform)"
          }
          if ($scan.summary.rootCount -ne "1") {
            throw "expected one Windows scan root, got $($scan.summary.rootCount)"
          }
          if ($scan.data.entries.Count -lt 1) {
            throw "expected Windows scan to report the fixture entry"
          }

          $stateError = & $env:BIN --format json --state-dir $stateDir scan $scanRoot 2>&1 | Out-String
          $stateExit = $LASTEXITCODE
          if ($stateExit -ne 3) {
            throw "explicit Windows state directory must fail closed with exit code 3, got $stateExit"
          }
          if ($stateError -notmatch "durable state is disabled on Windows") {
            throw "explicit Windows state directory did not report the fail-closed reason"
          }
          if (Test-Path -LiteralPath $stateDir) {
            throw "failed Windows state admission must not create the state directory"
          }
      - name: Smoke-test binary and capability truthfulness
        shell: bash
        env:
          BIN: ${{ matrix.executable }}
          EXPECTED_OS: ${{ matrix.capability_os }}
          EXPECTED_SCAN_STATE: ${{ matrix.scan_state }}
        run: |
          set -euo pipefail
          "$BIN" --version
          "$BIN" --help >/dev/null

          set +e
          "$BIN" --format json capabilities > capabilities.json
          status=$?
          set -e
          if [[ $status -ne 4 ]]; then
            echo "capabilities must report the documented partial exit code 4, got $status" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          with open("capabilities.json", encoding="utf-8") as handle:
              output = json.load(handle)
          if output["kind"] != "capabilities.result":
              raise SystemExit(f"unexpected output kind: {output['kind']}")
          expected_os = os.environ["EXPECTED_OS"]
          expected_state = os.environ["EXPECTED_SCAN_STATE"]
          if output["summary"]["currentPlatform"] != expected_os:
              raise SystemExit(f"expected current platform {expected_os}")
          records = [
              record for record in output["data"]["capabilities"]
              if record["qualificationKey"]["osFamily"] == expected_os
              and record["qualificationKey"]["capability"] == "scan.local.directory"
          ]
          if len(records) != 1 or records[0]["state"] != expected_state:
              raise SystemExit(
                  f"expected one {expected_os} scan capability in state {expected_state}"
              )
          PY
