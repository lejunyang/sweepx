name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  metadata:
    name: Validate release metadata
    if: contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Validate version and unpublished tag
        id: release
        run: scripts/check-release-metadata.sh --require-publish-marker --github-output "$GITHUB_OUTPUT"

  test:
    name: Release tests
    if: contains(github.event.head_commit.message, '[publish]')
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test full workspace
        run: cargo test --workspace --all-features --locked
      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.0
      - name: Reject private registries in Bun lockfiles
        run: |
          if grep -Eq 'https?://(bnpm\.byted\.org|[^/]*\.bytedance\.[^/]+)/' schemas/bun.lock site/bun.lock; then
            echo 'Bun lockfiles must use a registry reachable by public GitHub runners' >&2
            exit 1
          fi
      - name: Validate JSON schemas
        working-directory: schemas
        run: |
          bun install --frozen-lockfile
          bun run validate
      - name: Build documentation site
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun run docs:build
      - name: Test Unix installer
        run: bash scripts/test-installers.sh

  installer-windows:
    name: Windows installer tests
    if: contains(github.event.head_commit.message, '[publish]')
    needs: metadata
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test PowerShell installer
        shell: pwsh
        run: ./scripts/test-installers.ps1

  build:
    name: Build ${{ matrix.target }}
    if: contains(github.event.head_commit.message, '[publish]')
    needs: [metadata, test, installer-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            executable: target/x86_64-unknown-linux-gnu/release/sweepx
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            executable: target/aarch64-unknown-linux-gnu/release/sweepx
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            executable: target/x86_64-apple-darwin/release/sweepx
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            executable: target/aarch64-apple-darwin/release/sweepx
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            executable: target/x86_64-pc-windows-msvc/release/sweepx.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Build release CLI
        run: cargo build --release --locked --package sweepx-cli --target ${{ matrix.target }}
      - name: Smoke-test release CLI
        shell: bash
        env:
          BIN: ${{ matrix.executable }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          actual=$("$BIN" --version)
          expected="sweepx $VERSION"
          if [[ $actual != "$expected" ]]; then
            printf 'unexpected binary version: expected %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi
          "$BIN" --help >/dev/null

      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          BIN: ${{ matrix.executable }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          archive="sweepx-v$VERSION-$TARGET.tar.gz"
          staging=$(mktemp -d)
          trap 'rm -rf -- "$staging"' EXIT
          install -m 0755 "$BIN" "$staging/sweepx"
          mkdir -p dist
          tar -C "$staging" -czf "dist/$archive" sweepx
          [[ $(tar -tzf "dist/$archive") == sweepx ]] || {
            echo "archive must contain only one root-level sweepx binary" >&2
            exit 1
          }

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          BIN: ${{ matrix.executable }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "sweepx-v$env:VERSION-$env:TARGET.zip"
          $staging = Join-Path $env:RUNNER_TEMP "sweepx-package"
          New-Item -ItemType Directory -Force -Path $staging, "dist" | Out-Null
          Copy-Item -LiteralPath $env:BIN -Destination (Join-Path $staging "sweepx.exe")
          Compress-Archive -LiteralPath (Join-Path $staging "sweepx.exe") -DestinationPath (Join-Path "dist" $archive)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path (Join-Path "dist" $archive)))
          try {
            if ($zip.Entries.Count -ne 1 -or $zip.Entries[0].FullName -ne "sweepx.exe") {
              throw "archive must contain only one root-level sweepx.exe binary"
            }
          } finally {
            $zip.Dispose()
          }

      - name: Upload target archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/sweepx-v*-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Generate release checksums
    if: contains(github.event.head_commit.message, '[publish]')
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download target archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify archive set and write SHA256SUMS
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/sweepx-v"$VERSION"-*.tar.gz dist/sweepx-v"$VERSION"-*.zip)
          if ((${#archives[@]} != 5)); then
            printf 'expected 5 release archives, found %d\n' "${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum sweepx-v"$VERSION"-* | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Upload complete release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-${{ needs.metadata.outputs.tag }}
          path: |
            dist/sweepx-v*.tar.gz
            dist/sweepx-v*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  crates-io:
    name: Publish crates.io packages
    if: contains(github.event.head_commit.message, '[publish]')
    needs: [metadata, test, checksums]
    permissions:
      contents: read
      id-token: none
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh

  release:
    name: Create GitHub Release
    if: contains(github.event.head_commit.message, '[publish]')
    needs: [metadata, checksums, crates-io]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download complete release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-${{ needs.metadata.outputs.tag }}
          path: dist
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SweepX $VERSION" \
            --generate-notes
