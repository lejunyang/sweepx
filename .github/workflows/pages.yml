name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.4.0
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Reject private registries in lockfile
        working-directory: site
        run: |
          if grep -Eq 'https?://(bnpm\.byted\.org|[^/]*\.bytedance\.[^/]+)/' bun.lock; then
            echo 'site/bun.lock contains a private package registry URL' >&2
            exit 1
          fi
      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build site for project Pages
        working-directory: site
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: bun run docs:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
