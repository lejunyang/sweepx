[package]
name = "sweepx-platform-windows"
version.workspace = true
description = "Windows filesystem scanning backend for SweepX"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sweepx-platform = { version = "0.1.0", path = "../sweepx-platform" }
sweepx-model = { version = "0.1.0", path = "../sweepx-model" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  # `SHELLEXECUTEINFOW` embeds an `HKEY`, so the Registry feature is required to
  # name the struct at all -- not because SweepX touches the registry.
  "Win32_System_Registry",
  # Needed by the privilege backend to read the process token.
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  # Elevated relaunch (`ShellExecuteExW` with the `runas` verb).
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
