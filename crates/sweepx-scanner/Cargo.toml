[package]
name = "sweepx-scanner"
version.workspace = true
description = "Bounded no-follow filesystem scanning engine for SweepX"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sweepx-model = { version = "0.1.0", path = "../sweepx-model" }
sweepx-platform = { version = "0.1.0", path = "../sweepx-platform" }
thiserror = "2.0.16"

[target.'cfg(target_os = "linux")'.dependencies]
sweepx-platform-linux = { version = "0.1.0", path = "../sweepx-platform-linux", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
sweepx-platform-macos = { version = "0.1.0", path = "../sweepx-platform-macos", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
sweepx-platform-windows = { version = "0.1.0", path = "../sweepx-platform-windows", optional = true }

[dev-dependencies]
tempfile = "3.21.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
sweepx-fixtures = { version = "0.1.0", path = "../sweepx-fixtures" }

[features]
default = ["platform-linux", "platform-macos", "platform-windows"]
platform-linux = ["dep:sweepx-platform-linux"]
platform-macos = ["dep:sweepx-platform-macos"]
platform-windows = ["dep:sweepx-platform-windows"]
