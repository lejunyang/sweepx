[package]
name = "sweepx-scanner"
version.workspace = true
description = "Bounded no-follow filesystem scanning engine for SweepX"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sweepx-model = { version = "0.0.1", path = "../sweepx-model" }
sweepx-platform = { version = "0.0.1", path = "../sweepx-platform" }
thiserror = "2.0.16"

[dev-dependencies]
tempfile = "3.21.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
sweepx-fixtures = { version = "0.0.1", path = "../sweepx-fixtures" }

[features]
default = ["platform-linux", "platform-macos", "platform-windows"]
platform-linux = ["sweepx-platform/backend-linux"]
platform-macos = ["sweepx-platform/backend-macos"]
platform-windows = ["sweepx-platform/backend-windows"]
