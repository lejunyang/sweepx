[package]
name = "sweepx-cache"
version.workspace = true
description = "Validated bounded preview cache for SweepX scan results"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2.189"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.16"
sweepx-model = { version = "0.0.1", path = "../sweepx-model" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices",
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = "3.21.0"
