[package]
name = "sweepx-catalog"
version.workspace = true
description = "Built-in cleaner catalog loading and compatibility checks for SweepX"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
semver = "1.0.27"
sha2 = "0.10.9"
sweepx-cleaner-schema = { version = "0.1.0", path = "../sweepx-cleaner-schema" }
sweepx-canonical = { version = "0.1.0", path = "../sweepx-canonical" }
thiserror = "2.0.16"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
unicode-normalization = "0.1.24"

[dev-dependencies]
serde_json = { version = "1.0.145", features = ["preserve_order"] }
