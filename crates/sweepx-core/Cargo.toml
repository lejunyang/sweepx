[package]
name = "sweepx-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98.0"

[dependencies]
libc = "0.2.189"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.16"
time = { version = "0.3.44", features = ["formatting", "std"] }
sweepx-i18n = { path = "../sweepx-i18n" }
sweepx-model = { path = "../sweepx-model" }
sweepx-platform = { path = "../sweepx-platform" }
sweepx-protocol = { path = "../sweepx-protocol" }
sweepx-scanner = { path = "../sweepx-scanner", default-features = false, features = ["platform-linux", "platform-macos", "platform-windows"] }

[dev-dependencies]
tempfile = "3.21.0"
