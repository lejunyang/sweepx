[package]
name = "sweepx-tui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98.0"

[lib]
name = "sweepx_tui"
path = "src/lib.rs"

[[bin]]
name = "sweepx-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.28.1"
ratatui = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
sweepx-i18n = { path = "../sweepx-i18n" }
sweepx-model = { path = "../sweepx-model" }
sweepx-protocol = { path = "../sweepx-protocol" }
