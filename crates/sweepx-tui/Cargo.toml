[package]
name = "sweepx-tui"
autobins = false
version.workspace = true
description = "Read-only terminal browser for SweepX scan snapshots"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "sweepx_tui"
path = "src/lib.rs"

[dependencies]
crossterm = "0.28.1"
ratatui = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
unicode-width = "0.2.0"
sweepx-i18n = { version = "0.1.0", path = "../sweepx-i18n" }
sweepx-model = { version = "0.1.0", path = "../sweepx-model" }
sweepx-protocol = { version = "0.1.0", path = "../sweepx-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
