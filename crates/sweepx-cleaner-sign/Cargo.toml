[package]
name = "sweepx-cleaner-sign"
version.workspace = true
description = "Development-time signing tool for SweepX cleaner packages"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Not published: this tool exists so a cleaner package can be re-signed on any
# development machine. It must never be a dependency of the shipped CLI, because
# nothing that ships should be able to mint package signatures.
publish = false

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { version = "2.1.1", default-features = false, features = [
  "std",
  "rand_core",
] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { workspace = true }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = { workspace = true }
sweepx-catalog = { version = "0.1.0", path = "../sweepx-catalog" }
sweepx-cleaner-schema = { version = "0.1.0", path = "../sweepx-cleaner-schema" }
thiserror = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tempfile = "3.23.0"
