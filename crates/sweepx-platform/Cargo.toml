[package]
name = "sweepx-platform"
version.workspace = true
description = "Filesystem contracts and feature-selected native backends for SweepX"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
sweepx-model = { version = "0.0.1", path = "../sweepx-model" }
thiserror = "2.0.16"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { version = "0.2.189", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  # Shell elevation's native struct embeds a registry handle, without registry reads.
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libloading = "0.8.9"
sha2 = "0.10.9"
sweepx-fixtures = { version = "0.0.1", path = "../sweepx-fixtures" }
tempfile = "3.21.0"

[features]
# Contract-only consumers do not need a backend. Scanner forwards its existing platform flags.
default = []
backend-linux = ["dep:libc"]
backend-macos = ["dep:libc"]
backend-windows = ["dep:windows-sys"]
