[package]
name = "sweepx-platform-linux"
version.workspace = true
description = "Linux filesystem scanning backend for SweepX"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sweepx-model = { version = "0.0.1", path = "../sweepx-model" }
sweepx-platform = { version = "0.0.1", path = "../sweepx-platform" }

# The Linux backend body compiles only for Linux hosts, so `libc` and the Linux-only
# dev dependencies are target-gated. Without this, a Windows or macOS `--workspace`
# build resolves Linux-only libc items (openat2, statx, DIR) that do not exist on
# those targets and the whole workspace fails to compile.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libloading = "0.8.9"
sha2 = "0.10.9"
sweepx-fixtures = { version = "0.0.1", path = "../sweepx-fixtures" }
tempfile = "3.21.0"
