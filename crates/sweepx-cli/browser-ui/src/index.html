<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SweepX · 网站存储</title>
    <link rel="stylesheet" href="review.css" />
  </head>
  <body>
    <div id="preview-banner" class="preview-banner" hidden>
      开发预览 · 使用虚构数据，所有清理操作均为模拟
    </div>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#"
          ><span class="brand-mark" aria-hidden="true">S</span
          ><span
            >SweepX<small
              data-zh="浏览器清理"
              data-en="Browser cleanup"
            ></small></span
        ></a>
        <div class="nav-label" data-zh="工作台" data-en="WORKSPACE"></div>
        <nav aria-label="Workspace">
          <button class="nav-item active" data-view="sites">
            <span aria-hidden="true">◫</span
            ><span data-zh="网站存储" data-en="Site storage"></span></button
          ><button class="nav-item" data-view="direct">
            <span aria-hidden="true">⌁</span
            ><span
              data-zh="指定网站清理"
              data-en="Clear a website"
            ></span></button
          ><button class="nav-item" data-view="settings">
            <span aria-hidden="true">⚙</span
            ><span data-zh="连接与设置" data-en="Connection & settings"></span>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <span id="connection-dot" class="dot"></span
          ><span id="connection">未连接本地组件</span
          ><small
            data-zh="清理由当前浏览器执行"
            data-en="Clearing runs in this browser"
          ></small
          ><label class="language-label"
            ><span data-zh="界面语言" data-en="Language"></span
            ><select id="language" aria-label="Language">
              <option value="zh">简体中文</option>
              <option value="en">English</option>
            </select></label
          >
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div class="breadcrumb">
            SweepX <span>/</span> <span id="view-label">网站存储</span>
          </div>
          <div class="context">
            <span id="browser-label" class="chip">Edge</span
            ><span id="profile-label" class="chip subtle">Default</span
            ><button
              id="context-settings"
              class="text-button"
              data-zh="更改"
              data-en="Change"
            ></button>
          </div>
        </header>
        <div id="status" class="notice" role="status" hidden></div>
        <section id="sites-view" class="view">
          <div class="page-heading">
            <div>
              <div
                class="eyebrow"
                data-zh="看清占用，再决定清理"
                data-en="UNDERSTAND BEFORE CLEARING"
              ></div>
              <h1 data-zh="网站存储" data-en="Site storage"></h1>
              <p
                data-zh="按网站查看本机占用，了解每一份数据的来源。"
                data-en="See disk usage by website and understand what is stored."
              ></p>
            </div>
            <div class="heading-actions">
              <button id="scan" class="primary">
                <span aria-hidden="true">↻</span>
                <span data-zh="扫描占用" data-en="Scan storage"></span></button
              ><button
                id="cancel"
                class="secondary"
                hidden
                data-zh="取消扫描"
                data-en="Cancel scan"
              ></button>
            </div>
          </div>
          <div id="scan-state" class="scan-state" role="status" hidden>
            <span class="spinner"></span>
            <div>
              <strong
                data-zh="正在读取网站存储…"
                data-en="Reading site storage…"
              ></strong
              ><small
                data-zh="结果将在扫描完成后展示。取消会丢弃本次未完成的数据。"
                data-en="Results appear when the scan completes. Cancel discards unfinished data."
              ></small>
            </div>
          </div>
          <div class="stats">
            <article class="stat">
              <span
                data-zh="已归属网站的占用"
                data-en="Attributed to websites"
              ></span
              ><strong id="stat-size">—</strong
              ><small
                data-zh="逻辑大小 · 不等于可释放空间"
                data-en="Logical size · not reclaimable space"
              ></small>
            </article>
            <article class="stat">
              <span data-zh="已识别网站" data-en="Recognized websites"></span
              ><strong id="stat-count">—</strong
              ><small
                id="stat-items"
                data-zh="扫描后按占用排序"
                data-en="Sorted by size after scanning"
              ></small>
            </article>
            <article class="stat">
              <span
                data-zh="共享与未归属占用"
                data-en="Shared & unattributed"
              ></span
              ><strong id="stat-shared">—</strong
              ><small
                data-zh="HTTP 缓存等无法可靠归属到网站"
                data-en="Includes HTTP cache without reliable site attribution"
              ></small>
            </article>
          </div>
          <div class="workspace">
            <section class="panel site-panel">
              <div class="panel-heading">
                <div>
                  <h2 data-zh="网站列表" data-en="Websites"></h2>
                  <span
                    id="inventory-status"
                    class="muted"
                    data-zh="等待扫描"
                    data-en="Awaiting scan"
                  ></span>
                </div>
              </div>
              <div class="list-toolbar">
                <label class="search"
                  ><span aria-hidden="true">⌕</span
                  ><input
                    id="domain-filter"
                    type="search"
                    data-placeholder-zh="搜索网站域名…"
                    data-placeholder-en="Search domains…"
                    aria-label="Search domains"
                    maxlength="253" /></label
                ><select id="sort" aria-label="Sort websites">
                  <option
                    value="size"
                    data-zh="占用从大到小"
                    data-en="Largest first"
                  ></option>
                  <option
                    value="name"
                    data-zh="按域名排序"
                    data-en="Domain name"
                  ></option>
                </select>
              </div>
              <div id="empty" class="empty">
                <span class="empty-icon" aria-hidden="true">◫</span>
                <h3
                  id="empty-title"
                  data-zh="从一次扫描开始"
                  data-en="Start with a scan"
                ></h3>
                <p
                  id="empty-description"
                  data-zh="连接本地组件后，查看各网站的缓存、数据库和分区存储。"
                  data-en="Connect the local component to inspect caches, databases and partitioned storage."
                ></p>
                <button
                  id="empty-direct"
                  class="text-button"
                  data-zh="也可以直接指定网站清理 →"
                  data-en="Or clear a website directly →"
                ></button>
              </div>
              <div id="table-wrap" class="table-wrap" hidden>
                <table>
                  <thead>
                    <tr>
                      <th data-zh="网站" data-en="Website"></th>
                      <th
                        class="align-right"
                        data-zh="占用"
                        data-en="Size"
                      ></th>
                      <th
                        class="align-right"
                        data-zh="条目"
                        data-en="Items"
                      ></th>
                    </tr>
                  </thead>
                  <tbody id="domains"></tbody>
                </table>
              </div>
              <div id="pagination" class="pagination" hidden>
                <span id="page-label"></span>
                <div>
                  <button
                    id="page-prev"
                    class="icon-button"
                    aria-label="Previous page"
                  >
                    ←</button
                  ><button
                    id="page-next"
                    class="icon-button"
                    aria-label="Next page"
                  >
                    →
                  </button>
                </div>
              </div>
            </section>
            <aside class="panel details-panel">
              <div id="detail-empty" class="detail-empty">
                <span aria-hidden="true">↖</span>
                <h3 data-zh="选择一个网站" data-en="Select a website"></h3>
                <p
                  data-zh="查看占用组成和存储分区，然后选择适合的清理范围。"
                  data-en="Review its storage breakdown and partitions before choosing what to clear."
                ></p>
              </div>
              <div id="detail-content" hidden>
                <div class="detail-heading">
                  <div>
                    <span
                      class="eyebrow"
                      data-zh="网站详情"
                      data-en="WEBSITE DETAILS"
                    ></span>
                    <h2 id="detail-domain"></h2>
                  </div>
                </div>
                <div class="detail-total">
                  <strong id="detail-size"></strong
                  ><span
                    data-zh="已归属的逻辑大小"
                    data-en="Attributed logical size"
                  ></span>
                </div>
                <div id="detail-breakdown"></div>
                <div
                  class="section-label"
                  data-zh="存储明细"
                  data-en="STORAGE DETAILS"
                ></div>
                <div id="details"></div>
                <div class="detail-footer">
                  <p
                    data-zh="不能单选存储分区或 bucket；清理按网址来源与数据类型执行，实际处理范围由浏览器决定。"
                    data-en="Partitions and buckets cannot be selected individually. The browser determines coverage for the chosen origins and data types."
                  ></p>
                  <button
                    id="prepare"
                    class="primary full"
                    data-zh="选择清理范围"
                    data-en="Choose what to clear"
                  ></button>
                </div>
              </div>
            </aside>
          </div>
          <details class="panel shared-panel">
            <summary>
              <span
                data-zh="共享缓存与扫描覆盖"
                data-en="Shared storage & scan coverage"
              ></span
              ><small
                data-zh="无法归属网站的占用、读取问题"
                data-en="Unattributed usage and read issues"
              ></small>
            </summary>
            <p
              class="muted"
              data-zh="扫描默认位置与默认存储分区。运行中的网站可能改变数据；结果不是一致性快照。"
              data-en="Covers default locations and storage partitions. Active websites may change data; this is not an atomic snapshot."
            ></p>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th data-zh="存储类型" data-en="Storage type"></th>
                    <th
                      class="align-right"
                      data-zh="整体占用"
                      data-en="Total size"
                    ></th>
                    <th
                      class="align-right"
                      data-zh="未归属"
                      data-en="Unattributed"
                    ></th>
                  </tr>
                </thead>
                <tbody id="categories"></tbody>
              </table>
            </div>
            <ul id="scan-issues" class="muted"></ul>
          </details>
        </section>
        <section id="direct-view" class="view" hidden>
          <div class="page-heading">
            <div>
              <div
                class="eyebrow"
                data-zh="无需连接本地组件"
                data-en="NO LOCAL CONNECTION NEEDED"
              ></div>
              <h1 data-zh="指定网站清理" data-en="Clear a website"></h1>
              <p
                data-zh="由当前浏览器清理你指定的网站。无需启动 SweepX。"
                data-en="This browser can clear a website you specify. SweepX does not need to be running."
              ></p>
            </div>
          </div>
          <section class="panel direct-panel">
            <span class="feature-icon" aria-hidden="true">⌁</span>
            <h2
              data-zh="你想清理哪个网站？"
              data-en="Which website do you want to clear?"
            ></h2>
            <p
              class="muted"
              data-zh="输入完整域名，或带端口的 HTTP(S) 网址来源。不会包含子域名。"
              data-en="Enter an exact hostname or HTTP(S) origin, with a port if needed. Subdomains are excluded."
            ></p>
            <form id="direct-form">
              <label
                for="direct-site"
                data-zh="网站域名 / 网址来源"
                data-en="Website hostname / origin"
              ></label>
              <div class="direct-input">
                <input
                  id="direct-site"
                  type="text"
                  placeholder="example.com"
                  maxlength="4096"
                  required
                  autocomplete="off"
                /><button
                  id="direct-review"
                  class="primary"
                  data-zh="检查范围"
                  data-en="Review scope"
                ></button>
              </div>
            </form>
            <div class="info-card">
              <strong data-zh="占用大小未知" data-en="Size is unknown"></strong>
              <p
                data-zh="扩展能清理网站数据，但无法独立列出整个浏览器的磁盘占用。需要查看大小和存储分区时，使用「网站存储」扫描。"
                data-en="The extension can clear site data, but cannot independently inventory disk usage across the whole profile. Use Site storage for sizes and partitions."
              ></p>
            </div>
          </section>
        </section>
        <section id="settings-view" class="view" hidden>
          <div class="page-heading">
            <div>
              <div
                class="eyebrow"
                data-zh="本机通信"
                data-en="LOCAL CONNECTION"
              ></div>
              <h1 data-zh="连接与设置" data-en="Connection & settings"></h1>
              <p
                data-zh="本地组件提供大小和存储分区，浏览器负责清理。"
                data-en="The local component measures storage; the browser performs clearing."
              ></p>
            </div>
          </div>
          <section class="panel settings-panel">
            <h2 data-zh="扫描目标" data-en="Scan target"></h2>
            <p
              class="muted"
              data-zh="选择安装扩展的浏览器与个人资料目录。目录名不一定与浏览器显示名称相同。"
              data-en="Choose the browser and profile directory hosting this extension. Directory names may differ from displayed profile names."
            ></p>
            <div class="settings-fields">
              <label
                ><span data-zh="浏览器" data-en="Browser"></span
                ><select id="browser">
                  <option value="edge">Microsoft Edge</option>
                  <option value="chrome">Google Chrome</option>
                  <option value="edge-beta">Edge Beta</option>
                  <option value="edge-dev">Edge Dev</option>
                  <option value="chrome-beta">Chrome Beta</option>
                  <option value="chrome-dev">Chrome Dev</option>
                </select></label
              ><label
                ><span data-zh="个人资料目录" data-en="Profile directory"></span
                ><input
                  id="native-profile"
                  value="Default"
                  maxlength="64"
                  placeholder="Default / Profile 1"
              /></label>
            </div>
            <div class="button-row">
              <button
                id="connect"
                class="primary"
                data-zh="连接本地组件"
                data-en="Connect local component"
              ></button
              ><button
                id="disconnect"
                class="secondary"
                data-zh="断开"
                data-en="Disconnect"
              ></button>
            </div>
            <div class="info-card">
              <strong
                data-zh="不需要常驻后台程序"
                data-en="No background daemon needed"
              ></strong>
              <p
                data-zh="连接时浏览器自动启动已注册的本地组件。不能自动安装组件；需先用 SweepX 导出并注册。指定网站清理可以完全不连接。"
                data-en="The browser starts the registered native component on connection. Export and register it with SweepX first. Direct website clearing works without it."
              ></p>
            </div>
          </section>
          <section class="panel request-panel">
            <div class="panel-heading">
              <h2
                data-zh="SweepX 待确认请求"
                data-en="Pending SweepX requests"
              ></h2>
              <button
                id="poll"
                class="secondary"
                data-zh="检查待确认请求"
                data-en="Check requests"
              ></button>
            </div>
            <p id="request-status" role="status"></p>
            <p
              class="muted"
              data-zh="请求有效期为 15 分钟。清理范围始终由你确认；请求不会自动执行。"
              data-en="Requests expire after 15 minutes. You choose the scope; requests never execute automatically."
            ></p>
          </section>
        </section>
        <footer class="page-footer">
          <span>SweepX <span id="extension-version"></span></span
          ><span
            data-zh="数据留在本机 · 无远程上传"
            data-en="Local data · no remote uploads"
          ></span>
        </footer>
      </main>
    </div>
    <dialog id="review-dialog" aria-labelledby="review-title">
      <form method="dialog">
        <button
          id="dialog-close"
          type="button"
          class="dialog-close icon-button"
          aria-label="Close"
        >
          ×
        </button>
      </form>
      <div class="dialog-content">
        <span class="eyebrow" id="review-source"></span>
        <h2
          id="review-title"
          data-zh="确认清理范围"
          data-en="Review clearing scope"
        ></h2>
        <h3 id="review-domain"></h3>
        <p id="review-target" class="muted"></p>
        <div id="review-expiry" class="notice" hidden></div>
        <fieldset class="scope-options">
          <legend data-zh="选择数据范围" data-en="Choose data types"></legend>
          <label class="scope-option"
            ><input type="radio" name="mode" value="cache" /><span
              ><strong data-zh="仅清理缓存" data-en="Caches only"></strong
              ><small
                data-zh="网页资源缓存、网站离线缓存。网站可能重新下载。"
                data-en="HTTP resources and offline caches. Websites may download them again."
              ></small></span></label
          ><label class="scope-option"
            ><input type="radio" name="mode" value="storage" /><span
              ><strong
                data-zh="缓存与网站存储"
                data-en="Caches & site storage"
              ></strong
              ><small
                data-zh="还包含数据库、本地存储、Service Worker 和网站文件，可能丢失未同步内容。"
                data-en="Also databases, local storage, service workers and website files. Unsynced content may be lost."
              ></small></span
          ></label>
        </fieldset>
        <details class="origin-details">
          <summary
            data-zh="查看将清理的网址来源"
            data-en="Review exact origins"
          ></summary>
          <ul id="preview"></ul>
        </details>
        <div class="warning">
          <strong
            data-zh="清理无法撤销，也不会进入回收站。"
            data-en="Clearing cannot be undone and does not use Trash."
          ></strong
          ><span
            data-zh="不清理 Cookie、历史记录、密码和扩展数据。无法单选存储分区或 bucket，实际覆盖以浏览器接口为准。"
            data-en="Cookies, history, passwords and extension data are excluded. Individual partitions or buckets cannot be selected; coverage follows the browser API."
          ></span>
        </div>
        <label class="profile-check"
          ><input id="profile" type="checkbox" /><span
            id="profile-confirm-label"
          ></span
        ></label>
        <p id="operation-status" role="status" hidden></p>
        <div class="dialog-actions">
          <button
            id="reject"
            class="secondary"
            hidden
            data-zh="拒绝请求"
            data-en="Reject request"
          ></button
          ><button
            id="dialog-cancel"
            class="secondary"
            data-zh="取消"
            data-en="Cancel"
          ></button
          ><button
            id="remove"
            class="danger"
            disabled
            data-zh="确认清理"
            data-en="Confirm clearing"
          ></button>
        </div>
      </div>
    </dialog>
    <script type="module" src="review.mjs"></script>
  </body>
</html>
