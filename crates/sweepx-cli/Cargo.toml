[package]
name = "sweepx-cli"
version.workspace = true
description = "Unified command-line and interactive terminal interface for SweepX"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sweepx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
serde_json = "1.0.145"
sweepx-core = { version = "0.1.0", path = "../sweepx-core" }
sweepx-i18n = { version = "0.1.0", path = "../sweepx-i18n" }
sweepx-protocol = { version = "0.1.0", path = "../sweepx-protocol" }
sweepx-tui = { version = "0.1.0", path = "../sweepx-tui" }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
sweepx-cache = { version = "0.1.0", path = "../sweepx-cache" }
tempfile = "3.21.0"
