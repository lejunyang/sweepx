[package]
name = "sweepx-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98.0"

[[bin]]
name = "sweepx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
serde_json = "1.0.145"
sweepx-core = { path = "../sweepx-core" }
sweepx-i18n = { path = "../sweepx-i18n" }
sweepx-protocol = { path = "../sweepx-protocol" }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.21.0"
