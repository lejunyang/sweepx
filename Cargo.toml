[workspace]
members = [
  "crates/sweepx-model",
  "crates/sweepx-canonical",
  "crates/sweepx-protocol",
  "crates/sweepx-event-journal",
  "crates/sweepx-i18n",
  "crates/sweepx-platform",
  "crates/sweepx-platform-linux",
  "crates/sweepx-platform-macos",
  "crates/sweepx-platform-windows",
  "crates/sweepx-scanner",
  "crates/sweepx-cache",
  "crates/sweepx-fixtures",
  "crates/sweepx-core",
  "crates/sweepx-cli",
  "crates/sweepx-analysis",
  "crates/sweepx-cleaner-schema",
  "crates/sweepx-cleaner-vm",
  "crates/sweepx-catalog",
  "crates/sweepx-tui",
  "crates/sweepx-safety",
  "crates/sweepx-audit",
  "crates/sweepx-executor",
  "crates/sweepx-cleaner-sign",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["lejunyang"]
repository = "https://github.com/lejunyang/sweepx"
homepage = "https://github.com/lejunyang/sweepx"
documentation = "https://lejunyang.github.io/sweepx/"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98.0"

[workspace.dependencies]
base64 = "0.22.1"
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_jcs = "0.1.0"
sha2 = "0.10.9"
thiserror = "2.0.16"
time = { version = "0.3.44", features = ["formatting", "parsing", "std"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
