[workspace]
members = [
  "crates/sweepx-model",
  "crates/sweepx-canonical",
  "crates/sweepx-protocol",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98.0"

[workspace.dependencies]
base64 = "0.22.1"
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_jcs = "0.1.0"
sha2 = "0.10.9"
thiserror = "2.0.16"
